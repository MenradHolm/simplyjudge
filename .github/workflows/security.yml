name: Security and production artifacts
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DEBUG: 'False'
      ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      SECURE_HSTS_INCLUDE_SUBDOMAINS: 'True'
      SECURE_HSTS_PRELOAD: 'True'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.lock -r requirements-security.txt
      - name: Generate ephemeral server signing key
        run: python -c "import secrets; import os; open(os.environ['GITHUB_ENV'], 'a').write('SECRET_' + 'KEY=' + secrets.token_urlsafe(64) + '\n')"
      - run: python manage.py test
        env:
          SECURE_SSL_REDIRECT: 'False'
      - run: python tools/verify_release.py
